# MeshVoice — деплой бэкенда в Docker.
#
# Вариант A (рекомендуется у вас): за уже существующим nginx.
#   nginx терминирует TLS и проксирует на meshvoice-server:3000 по имени
#   контейнера. Контейнер подключается к общей docker-сети nginx (PROXY_NETWORK).
#     PROXY_NETWORK=<сеть nginx> docker compose up -d --build
#   Caddy при этом НЕ нужен (профиль https не включаем).
#
# Вариант B (standalone, свой HTTPS через Caddy):
#     docker network create meshvoice-proxy   # один раз
#     docker compose --profile https up -d --build   (DOMAIN в .env)
#
# Данные (БД, загрузки) — в именованных томах, переживают пересборку.
# Автозапуск после падения/ребута — restart: unless-stopped.

services:
  server:
    build:
      context: ./server
    image: meshvoice-server
    container_name: meshvoice-server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_PATH: /data/meshvoice.db
      # Секрет токенов задаём явно, чтобы он был стабилен между пересборками.
      # Сгенерируйте один раз: `openssl rand -hex 32` и положите в .env.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан — скопируйте .env.example в .env и заполните}
    volumes:
      - mv-data:/data           # meshvoice.db
      - mv-uploads:/app/uploads # вложения чата, фото событий, метки карты
    networks:
      - proxy
    # Наружу порт НЕ публикуем: трафик идёт через nginx/Caddy по docker-сети.
    # Для локальной отладки на самом сервере оставлен доступ только с localhost.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Caddy: автоматический Let's Encrypt-сертификат + reverse proxy на :3000.
  # Только для варианта B (standalone). Поднимается профилем https.
  caddy:
    image: caddy:2-alpine
    container_name: meshvoice-caddy
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN не задан — заполните в .env для профиля https}
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  # Общая внешняя сеть. Вариант A: имя сети вашего nginx (PROXY_NETWORK в .env).
  # Вариант B: `docker network create meshvoice-proxy` (значение по умолчанию).
  proxy:
    external: true
    name: ${PROXY_NETWORK:-meshvoice-proxy}

volumes:
  mv-data:
  mv-uploads:
  caddy-data:
  caddy-config:
